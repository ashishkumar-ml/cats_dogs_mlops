      #   run: |
      #     kubectl set image deployment/cats-dogs-api \
      #       cats-dogs-api=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
      #       --record
      #     kubectl rollout status deployment/cats-dogs-api --timeout=120s
